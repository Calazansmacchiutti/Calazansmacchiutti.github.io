<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#adb5bd"></path>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c92a2a"></path>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"></rect>
  <text x="30" y="34" font-size="16" font-weight="700" fill="#212529">Answering with an audit trail</text>
  <text x="30" y="53" font-size="11.5" fill="#868e96">Two gates and one ledger - a refusal is a valid outcome, not an error</text>

  <!-- happy path arrows -->
  <g stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="140" y1="120" x2="184" y2="120"></line>
    <line x1="300" y1="120" x2="344" y2="120"></line>
    <line x1="460" y1="120" x2="504" y2="120"></line>
    <line x1="620" y1="120" x2="664" y2="120"></line>
  </g>
  <!-- retrieval loop -->
  <g stroke="#adb5bd" stroke-width="1.5">
    <path d="M404,148 L404,186 L344,186" fill="none" marker-end="url(#arrow)"></path>
    <path d="M264,186 L204,186 L204,148" fill="none" marker-end="url(#arrow)"></path>
  </g>
  <!-- refusal arrows -->
  <g stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)">
    <path d="M244,92 L244,62 L742,62 L742,92" fill="none"></path>
    <path d="M564,92 L564,74 L740,74" fill="none"></path>
  </g>

  <!-- nodes -->
  <g>
    <rect x="30" y="98" width="110" height="44" rx="6" fill="#f1f3f5" stroke="#dee2e6"></rect>
    <text x="85" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#212529">question</text>
    <text x="85" y="133" font-size="10.5" text-anchor="middle" fill="#868e96">+ scope</text>

    <rect x="184" y="98" width="116" height="44" rx="6" fill="#fff5f5" stroke="#ffc9c9"></rect>
    <text x="242" y="117" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c92a2a">input guard</text>
    <text x="242" y="132" font-size="10" text-anchor="middle" fill="#e03131">advice request?</text>

    <rect x="344" y="98" width="116" height="50" rx="6" fill="#e7f5ff" stroke="#a5d8ff"></rect>
    <text x="402" y="117" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1864ab">agent loop</text>
    <text x="402" y="132" font-size="10" text-anchor="middle" fill="#1971c2">retrieve &#183; reason</text>
    <text x="402" y="144" font-size="10" text-anchor="middle" fill="#1971c2">answer &#183; self-check</text>

    <rect x="504" y="98" width="116" height="44" rx="6" fill="#fff5f5" stroke="#ffc9c9"></rect>
    <text x="562" y="117" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c92a2a">output guard</text>
    <text x="562" y="132" font-size="10" text-anchor="middle" fill="#e03131">valid citation?</text>

    <rect x="664" y="98" width="116" height="44" rx="6" fill="#ebfbee" stroke="#b2f2bb"></rect>
    <text x="722" y="118" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2b8a3e">answer</text>
    <text x="722" y="133" font-size="10" text-anchor="middle" fill="#37b24d">+ cited sources</text>

    <!-- retriever -->
    <rect x="264" y="168" width="120" height="46" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect>
    <text x="324" y="187" font-size="11.5" font-weight="600" text-anchor="middle" fill="#212529">retrieval</text>
    <text x="324" y="202" font-size="10" text-anchor="middle" fill="#868e96">scope filter first</text>

    <!-- refusal -->
    <rect x="684" y="40" width="112" height="34" rx="6" fill="#fff9db" stroke="#ffe066"></rect>
    <text x="740" y="61" font-size="11" font-weight="600" text-anchor="middle" fill="#e67700">refusal + reason</text>

    <!-- audit -->
    <rect x="440" y="242" width="300" height="40" rx="6" fill="#f8f9fa" stroke="#ced4da"></rect>
    <text x="590" y="259" font-size="11.5" font-weight="600" text-anchor="middle" fill="#212529">append-only audit trail</text>
    <text x="590" y="273" font-size="10" text-anchor="middle" fill="#868e96">chunk id &#183; prompt version &#183; model &#183; user &#183; decision</text>
  </g>
  <g stroke="#ced4da" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="722" y1="142" x2="722" y2="242"></line>
    <line x1="740" y1="74" x2="740" y2="90" stroke-dasharray="0"></line>
    <line x1="510" y1="262" x2="440" y2="262" stroke-dasharray="0" opacity="0"></line>
  </g>
  <text x="30" y="272" font-size="10.5" fill="#868e96">Scope is enforced in retrieval, not by prompt instruction  - </text>
  <text x="30" y="286" font-size="10.5" fill="#868e96">out-of-scope text never reaches the model.</text>
</svg>
