<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" role="img" aria-labelledby="t d">
<title id="t">Flight delay pipeline, from raw records to an imbalance-aware evaluation</title><desc id="d">5.2 million flight records pass through SQL-based ETL and cleaning, a train/test split, three competing classifiers, and an evaluation that reads precision and recall rather than accuracy.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7c93"/></marker>
<style>
.b{fill:#eef2f7;stroke:#4a6fa5;stroke-width:1.5}
.acc{fill:#dbe7f5;stroke:#2f5c8f;stroke-width:2}
.t{fill:#1f2d3d;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;text-anchor:middle}
.tb{font-weight:600}
.s{fill:#5a6b7d;font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;text-anchor:middle}
.lbl{fill:#5a6b7d;font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;font-style:italic;text-anchor:middle}
.e{stroke:#6b7c93;stroke-width:1.6;fill:none;marker-end:url(#a)}
</style></defs>
<rect x="20" y="110" width="140" height="80" rx="8" class="b"/><text x="90.0" y="148.0" class="t tb">Flight records</text><text x="90.0" y="180" class="s">5,245,484 rows</text><rect x="200" y="110" width="140" height="80" rx="8" class="b"/><text x="270.0" y="148.0" class="t tb">ETL in SQL</text><text x="270.0" y="180" class="s">join + top airports</text><rect x="380" y="110" width="140" height="80" rx="8" class="b"/><text x="450.0" y="148.0" class="t tb">Cleaning</text><text x="450.0" y="180" class="s">5,244,628 rows</text><rect x="560" y="40" width="160" height="62" rx="8" class="b"/><text x="640.0" y="76.0" class="t tb">Logistic Regression</text><rect x="560" y="119" width="160" height="62" rx="8" class="b"/><text x="640.0" y="155.0" class="t tb">Random Forest</text><rect x="560" y="198" width="160" height="62" rx="8" class="b"/><text x="640.0" y="234.0" class="t tb">Gradient Boosting</text><rect x="770" y="110" width="170" height="80" rx="8" class="acc"/><text x="855.0" y="140.0" class="t tb">Evaluation under</text><text x="855.0" y="156.0" class="t">18% base rate</text><text x="855.0" y="180" class="s">precision vs recall</text><path class="e" d="M160,150 L198,150"/><path class="e" d="M340,150 L378,150"/><path class="e" d="M520,140 L558,80"/><path class="e" d="M520,150 L558,150"/><path class="e" d="M520,160 L558,220"/><path class="e" d="M720,80 L768,140"/><path class="e" d="M720,150 L768,150"/><path class="e" d="M720,220 L768,160"/></svg>