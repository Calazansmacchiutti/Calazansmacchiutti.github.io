<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="300" fill="#ffffff"></rect>
  <text x="40" y="30" font-size="16" font-weight="700" fill="#212529">Bakeoff progression &#8212; validation CER</text>
  <text x="40" y="49" font-size="11.5" fill="#868e96">From the first small model to the promoted baseline, in %</text>

  <!-- y gridlines + labels (0..20) -->
  <g stroke="#e9ecef" stroke-width="1">
    <line x1="70" y1="70" x2="680" y2="70"></line>
    <line x1="70" y1="115" x2="680" y2="115"></line>
    <line x1="70" y1="160" x2="680" y2="160"></line>
    <line x1="70" y1="205" x2="680" y2="205"></line>
    <line x1="70" y1="250" x2="680" y2="250"></line>
  </g>
  <g font-size="10.5" fill="#adb5bd" text-anchor="end">
    <text x="60" y="74">20</text>
    <text x="60" y="119">15</text>
    <text x="60" y="164">10</text>
    <text x="60" y="209">5</text>
    <text x="60" y="254">0</text>
  </g>

  <!-- descending line: 17.95 -> 15.40 -> 9.97 -> 9.57 -->
  <!-- y = 250 - (v/20)*180 ; x: 150, 320, 490, 630 -->
  <polyline points="150,88.5 320,111.4 490,160.3 630,163.9" fill="none" stroke="#0d6efd" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>

  <!-- points -->
  <circle cx="150" cy="88.5" r="5" fill="#fff" stroke="#adb5bd" stroke-width="2.5"></circle>
  <circle cx="320" cy="111.4" r="5" fill="#fff" stroke="#adb5bd" stroke-width="2.5"></circle>
  <circle cx="490" cy="160.3" r="5" fill="#fff" stroke="#adb5bd" stroke-width="2.5"></circle>
  <circle cx="630" cy="163.9" r="6" fill="#0d6efd" stroke="#0d6efd" stroke-width="2.5"></circle>

  <!-- value labels -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="150" y="77" fill="#868e96">17.95</text>
    <text x="320" y="100" fill="#868e96">15.40</text>
    <text x="490" y="149" fill="#868e96">9.97</text>
    <text x="630" y="152" fill="#0d6efd">9.57</text>
  </g>

  <!-- x labels -->
  <g font-size="10.5" fill="#6c757d" text-anchor="middle">
    <text x="150" y="270">crnn-small</text>
    <text x="150" y="284">10 epochs</text>
    <text x="320" y="270">crnn-small</text>
    <text x="320" y="284">anchored resume</text>
    <text x="490" y="270">crnn-large</text>
    <text x="490" y="284">12 epochs</text>
    <text x="630" y="270" fill="#0d6efd" font-weight="700">crnn-large</text>
    <text x="630" y="284" fill="#0d6efd">LR-tuned resume</text>
  </g>
</svg>
