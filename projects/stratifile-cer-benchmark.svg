<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f1f3f5"></rect>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ced4da" stroke-width="2"></line>
    </pattern>
  </defs>
  <rect width="720" height="300" fill="#ffffff"></rect>
  <text x="40" y="30" font-size="16" font-weight="700" fill="#212529">Line CER on BRESSAY (validation)</text>
  <text x="40" y="49" font-size="11.5" fill="#868e96">Character Error Rate, in % &#8212; lower is better</text>

  <!-- gridlines -->
  <g stroke="#e9ecef" stroke-width="1">
    <line x1="150" y1="66" x2="150" y2="252"></line>
    <line x1="278.9" y1="66" x2="278.9" y2="252"></line>
    <line x1="407.9" y1="66" x2="407.9" y2="252"></line>
    <line x1="536.8" y1="66" x2="536.8" y2="252"></line>
  </g>
  <g font-size="11" fill="#adb5bd" text-anchor="middle">
    <text x="150" y="270">0</text>
    <text x="278.9" y="270">5</text>
    <text x="407.9" y="270">10</text>
    <text x="536.8" y="270">15</text>
  </g>

  <!-- bars -->
  <text x="140" y="79" text-anchor="end" font-size="12.5" fill="#495057" font-weight="600">PERO</text>
  <text x="140" y="93" text-anchor="end" font-size="10" fill="#adb5bd">ICDAR '24 winner</text>
  <rect x="150" y="66" width="74.2" height="26" rx="3" fill="url(#hatch)" stroke="#ced4da" stroke-width="1"></rect>
  <text x="230" y="83" font-size="12" fill="#868e96" font-weight="600">2.88</text>

  <text x="140" y="119" text-anchor="end" font-size="12.5" fill="#495057" font-weight="600">Puigcerver</text>
  <text x="140" y="133" text-anchor="end" font-size="10" fill="#adb5bd">baseline</text>
  <rect x="150" y="106" width="230.8" height="26" rx="3" fill="#adb5bd"></rect>
  <text x="386.8" y="123" font-size="12" fill="#868e96" font-weight="600">8.95</text>

  <text x="140" y="159" text-anchor="end" font-size="12.5" fill="#0d6efd" font-weight="700">crnn-large</text>
  <text x="140" y="173" text-anchor="end" font-size="10" fill="#0d6efd">this project</text>
  <rect x="150" y="146" width="246.8" height="26" rx="3" fill="#0d6efd"></rect>
  <text x="402.8" y="163" font-size="12" fill="#0d6efd" font-weight="700">9.57</text>

  <text x="140" y="199" text-anchor="end" font-size="12.5" fill="#495057" font-weight="600">Flor</text>
  <text x="140" y="213" text-anchor="end" font-size="10" fill="#adb5bd">baseline</text>
  <rect x="150" y="186" width="264.6" height="26" rx="3" fill="#adb5bd"></rect>
  <text x="420.6" y="203" font-size="12" fill="#868e96" font-weight="600">10.26</text>

  <text x="140" y="239" text-anchor="end" font-size="12.5" fill="#495057" font-weight="600">Bluche</text>
  <text x="140" y="253" text-anchor="end" font-size="10" fill="#adb5bd">baseline</text>
  <rect x="150" y="226" width="464.7" height="26" rx="3" fill="#adb5bd"></rect>
  <text x="620.7" y="243" font-size="12" fill="#868e96" font-weight="600">18.02</text>
</svg>
